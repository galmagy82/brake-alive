# GitHub Pages 배포 워크플로우
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Dev site only (crash.aimagdic.com): keep it out of search engines; the production repo skips this step
      - if: github.repository == 'galmagy82/fatal-crash'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      # Wait until the uploaded artifact is listed (deploy-pages sometimes finds 0 artifacts right after upload)
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
